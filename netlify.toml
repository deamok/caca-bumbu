# Netlify — konfigurasi deploy Caca Bumbu
# Build statis Vite; kredensial Supabase diisi lewat Environment variables:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
# Tanpa dua variabel itu aplikasi tetap jalan dalam mode lokal (tanpa cloud).

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Aplikasi memakai hash router (#/titip/...), jadi fallback ini hanya jaring
# pengaman untuk tautan lama. File statis yang ada selalu diutamakan Netlify.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Service worker harus selalu segar agar build baru cepat terpakai.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[context.deploy-preview]
  command = "pnpm build"
